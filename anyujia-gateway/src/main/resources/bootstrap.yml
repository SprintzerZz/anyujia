server:
  port: ${GATEWAY_SERVER_PORT:18080}

spring:
  config:
    import:
      - optional:nacos:share-redis-${RUN_ENV:dev}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:anyujia-gateway-${RUN_ENV:dev}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  application:
    name: anyujia-gateway
  profiles:
    active: ${RUN_ENV:dev}
  cloud:
    nacos:
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:change-me}
        namespace: frameworkjava-${RUN_ENV:dev}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
        fail-fast: false
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:change-me}
        namespace: frameworkjava-${RUN_ENV:dev}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
        file-extension: yaml
        extension-configs:
          - data-id: ${spring.application.name}-${spring.profiles.active}.yaml
            group: ${spring.cloud.nacos.config.group}
            refresh: true
        shared-configs:
          - data-id: share-redis-${RUN_ENV:dev}.yaml
            group: DEFAULT_GROUP
            refresh: true
    gateway:
      metrics:
        enabled: ${GATEWAY_METRICS_ENABLED:true}
      httpclient:
        connect-timeout: ${GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT:15s}
        pool:
          # 固定连接池，避免默认 Elastic 池在下游变慢时无限堆积等待请求。
          type: ${GATEWAY_HTTPCLIENT_POOL_TYPE:fixed}
          name: ${GATEWAY_HTTPCLIENT_POOL_NAME:gateway}
          max-connections: ${GATEWAY_HTTPCLIENT_MAX_CONNECTIONS:256}
          acquire-timeout: ${GATEWAY_HTTPCLIENT_ACQUIRE_TIMEOUT_MS:1000}
          max-idle-time: ${GATEWAY_HTTPCLIENT_MAX_IDLE_TIME:30s}
          max-life-time: ${GATEWAY_HTTPCLIENT_MAX_LIFE_TIME:5m}
          eviction-interval: ${GATEWAY_HTTPCLIENT_EVICTION_INTERVAL:30s}
          metrics: ${GATEWAY_HTTPCLIENT_POOL_METRICS_ENABLED:true}
      routes:
        - id: anyujia-admin
          uri: lb://anyujia-admin
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1
        - id: anyujia-coupon
          uri: lb://anyujia-coupon
          predicates:
            - Path=/coupon/**
        - id: anyujia-chat-websocket
          uri: ${CHAT_WEBSOCKET_URI:lb:ws://anyujia-chat}
          predicates:
            - Path=/chat/websocket
        - id: anyujia-chat
          uri: lb://anyujia-chat
          predicates:
            - Path=/chat/**
        - id: anyujia-house
          uri: lb://anyujia-house
          predicates:
            - Path=/house/**
        - id: anyujia-file
          uri: lb://anyujia-file
          predicates:
            - Path=/file/**
          filters:
            - StripPrefix=1
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true

logging:
  pattern:
    console: "[%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threadpool

security:
  ignore:
    whites:
      - /actuator/**
