upstream legal_entailment_backend {
    least_conn;
    server frameworkjava-legal-entailment-1:18091 max_fails=3 fail_timeout=5s;
    server frameworkjava-legal-entailment-2:18091 max_fails=3 fail_timeout=5s;
}

server {
    listen 18091;

    location = /health {
        proxy_pass http://legal_entailment_backend/health;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
    }

    location = /ready {
        proxy_pass http://legal_entailment_backend/ready;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
    }

    location = /entailment {
        proxy_pass http://legal_entailment_backend/entailment;
        proxy_http_version 1.1;
        proxy_connect_timeout 1s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_429 http_500 http_502 http_503 http_504;
    }
}
