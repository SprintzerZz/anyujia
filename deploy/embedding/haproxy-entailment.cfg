global
    maxconn 2048

defaults
    mode http
    timeout connect 1s
    timeout client 30s
    timeout server 30s
    option httplog

frontend legal_entailment_frontend
    bind *:18091
    default_backend legal_entailment_backend

backend legal_entailment_backend
    balance leastconn
    option httpchk GET /ready
    http-check expect status 200
    option redispatch
    server entailment_1 frameworkjava-legal-entailment-1:18091 check inter 1s fall 2 rise 2
    server entailment_2 frameworkjava-legal-entailment-2:18091 check inter 1s fall 2 rise 2
