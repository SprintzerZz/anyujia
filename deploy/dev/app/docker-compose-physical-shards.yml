      retries: 12
      start_period: 30s
    restart: always

  frameworkjava-mysql-shard-3:
    container_name: frameworkjava-mysql-shard-3
    image: mysql:8.4.2
    command:
      - mysqld
      - --innodb-buffer-pool-size=512M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+8:00
