    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
    ports:
      - "23311:3306"
    volumes:
      - chat_mysql_shard_1:/var/lib/mysql
    networks:
