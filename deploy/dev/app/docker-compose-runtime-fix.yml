        until getent hosts frameworkjava-redis-master >/dev/null 2>&1; do sleep 1; done
        MASTER_IP=$$(getent ahostsv4 frameworkjava-redis-master | awk 'NR==1 {print $$1}')
        cat > /tmp/sentinel.conf <<EOF
        port 26379
