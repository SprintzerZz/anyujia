server:
  port: ${LEGAL_SERVER_PORT:18086}

spring:
  servlet:
    multipart:
      max-file-size: ${LEGAL_MAX_FILE_SIZE:25MB}
      max-request-size: ${LEGAL_MAX_REQUEST_SIZE:26MB}
  config:
    import:
      - optional:nacos:anyujia-legal-${RUN_ENV:dev}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:share-rabbitmq-${RUN_ENV:dev}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  application:
    name: anyujia-legal
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
  profiles:
    active: ${RUN_ENV:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:frameworkjava_dev}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:anyujiadev}
    password: ${MYSQL_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change-me}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5s}
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${LEGAL_FEIGN_CONNECT_TIMEOUT_MILLIS:2000}
            readTimeout: ${LEGAL_FEIGN_READ_TIMEOUT_MILLIS:5000}
            loggerLevel: ${LEGAL_FEIGN_LOG_LEVEL:none}
    nacos:
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:change-me}
        namespace: frameworkjava-${RUN_ENV:dev}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
        fail-fast: false
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:change-me}
        namespace: frameworkjava-${RUN_ENV:dev}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
        file-extension: yaml

legal:
  async:
    core-pool-size: ${LEGAL_ASSESSMENT_CORE_POOL_SIZE:2}
    max-pool-size: ${LEGAL_ASSESSMENT_MAX_POOL_SIZE:4}
    queue-capacity: ${LEGAL_ASSESSMENT_QUEUE_CAPACITY:100}
    await-termination-seconds: ${LEGAL_ASSESSMENT_AWAIT_TERMINATION_SECONDS:30}
  sse:
    scheduler-pool-size: ${LEGAL_SSE_SCHEDULER_POOL_SIZE:4}
    max-connections: ${LEGAL_SSE_MAX_CONNECTIONS:2000}
  agent:
    core-pool-size: ${LEGAL_AGENT_CORE_POOL_SIZE:4}
    max-pool-size: ${LEGAL_AGENT_MAX_POOL_SIZE:16}
    queue-capacity: ${LEGAL_AGENT_QUEUE_CAPACITY:200}
    consumer-concurrency: ${LEGAL_AGENT_CONSUMER_CONCURRENCY:4}
    recovery-delay-millis: ${LEGAL_AGENT_RECOVERY_DELAY_MILLIS:30000}
    outbox:
      poll-millis: ${LEGAL_AGENT_OUTBOX_POLL_MILLIS:1000}
      batch-size: ${LEGAL_AGENT_OUTBOX_BATCH_SIZE:100}
      max-retries: ${LEGAL_AGENT_OUTBOX_MAX_RETRIES:10}
      processing-timeout-millis: ${LEGAL_AGENT_OUTBOX_PROCESSING_TIMEOUT_MILLIS:60000}
  trace:
    archive-enabled: ${LEGAL_TRACE_ARCHIVE_ENABLED:true}
    retention-days: ${LEGAL_TRACE_RETENTION_DAYS:90}
    archive-batch-size: ${LEGAL_TRACE_ARCHIVE_BATCH_SIZE:500}
    archive-cron: ${LEGAL_TRACE_ARCHIVE_CRON:0 20 3 * * *}
  assessment:
    lease-seconds: ${LEGAL_ASSESSMENT_LEASE_SECONDS:1800}
    recovery-delay-millis: ${LEGAL_ASSESSMENT_RECOVERY_DELAY_MILLIS:30000}
    recovery-initial-delay-millis: ${LEGAL_ASSESSMENT_RECOVERY_INITIAL_DELAY_MILLIS:10000}
  document:
    max-bytes: ${LEGAL_DOCUMENT_MAX_BYTES:26214400}
    max-pages: ${LEGAL_DOCUMENT_MAX_PAGES:200}
    max-characters: ${LEGAL_DOCUMENT_MAX_CHARACTERS:500000}
    max-blocks: ${LEGAL_DOCUMENT_MAX_BLOCKS:5000}
  memory:
    redis-enabled: ${LEGAL_MEMORY_REDIS_ENABLED:true}
    short-term-ttl-seconds: ${LEGAL_MEMORY_SHORT_TERM_TTL_SECONDS:1800}
    chat-window-limit: ${LEGAL_MEMORY_CHAT_WINDOW_LIMIT:100}
  ai:
    enabled: ${LEGAL_AI_ENABLED:false}
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    chat-model: ${LEGAL_CHAT_MODEL:qwen-plus}
    connect-timeout-millis: ${LEGAL_AI_CONNECT_TIMEOUT_MILLIS:5000}
    read-timeout-millis: ${LEGAL_AI_READ_TIMEOUT_MILLIS:30000}
    failure-threshold: ${LEGAL_AI_FAILURE_THRESHOLD:2}
    cooldown-seconds: ${LEGAL_AI_COOLDOWN_SECONDS:60}
    embedding:
      enabled: ${LEGAL_EMBEDDING_ENABLED:false}
      model: ${LEGAL_EMBEDDING_MODEL:text-embedding-v4}
      dimensions: ${LEGAL_EMBEDDING_DIMENSIONS:1024}
      batch-size: ${LEGAL_EMBEDDING_BATCH_SIZE:16}
      cache-enabled: ${LEGAL_EMBEDDING_CACHE_ENABLED:true}
      cache-ttl-seconds: ${LEGAL_EMBEDDING_CACHE_TTL_SECONDS:86400}
      cache-max-entries: ${LEGAL_EMBEDDING_CACHE_MAX_ENTRIES:2000}
    vector:
      enabled: ${LEGAL_VECTOR_ENABLED:false}
    retrieval:
      channel-candidate-limit: ${LEGAL_RETRIEVAL_CHANNEL_CANDIDATE_LIMIT:50}
      rerank-candidate-limit: ${LEGAL_RETRIEVAL_RERANK_CANDIDATE_LIMIT:30}
      max-chunk-candidates: ${LEGAL_RETRIEVAL_MAX_CHUNK_CANDIDATES:2000}
      rrf-k: ${LEGAL_RETRIEVAL_RRF_K:60}
      lexical-weight: ${LEGAL_RETRIEVAL_LEXICAL_WEIGHT:1.0}
      vector-weight: ${LEGAL_RETRIEVAL_VECTOR_WEIGHT:1.2}
      intent-weight: ${LEGAL_RETRIEVAL_INTENT_WEIGHT:0.8}
      rerank-weight: ${LEGAL_RETRIEVAL_RERANK_WEIGHT:0.35}
    milvus:
      enabled: ${LEGAL_MILVUS_ENABLED:false}
      host: ${LEGAL_MILVUS_HOST:127.0.0.1}
      port: ${LEGAL_MILVUS_PORT:19530}
      database: ${LEGAL_MILVUS_DATABASE:default}
      collection: ${LEGAL_MILVUS_COLLECTION:legal_source_chunk_v1}
      dimension: ${LEGAL_MILVUS_DIMENSION:1024}
      top-k: ${LEGAL_MILVUS_TOP_K:50}
      connect-timeout-millis: ${LEGAL_MILVUS_CONNECT_TIMEOUT_MILLIS:10000}
    local-embedding:
      enabled: ${LEGAL_LOCAL_EMBEDDING_ENABLED:false}
      endpoint: ${LEGAL_LOCAL_EMBEDDING_ENDPOINT:http://127.0.0.1:18091/embed}
      model: ${LEGAL_LOCAL_EMBEDDING_MODEL:BAAI/bge-large-zh-v1.5}
      dimensions: ${LEGAL_LOCAL_EMBEDDING_DIMENSIONS:1024}
    local-reranker:
      enabled: ${LEGAL_LOCAL_RERANKER_ENABLED:false}
      endpoint: ${LEGAL_LOCAL_RERANKER_ENDPOINT:http://127.0.0.1:18091/rerank}
      model: ${LEGAL_LOCAL_RERANKER_MODEL:BAAI/bge-reranker-v2-m3}
      top-n: ${LEGAL_RERANK_TOP_N:8}

management.endpoints.web.exposure.include: health,info

