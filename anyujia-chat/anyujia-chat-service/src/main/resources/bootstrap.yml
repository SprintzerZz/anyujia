server:
  port: ${CHAT_SERVER_PORT:18083}

spring:
  config:
    import:
      - optional:nacos:share-redis-${RUN_ENV:dev}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:share-rabbitmq-${RUN_ENV:dev}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:anyujia-chat-${RUN_ENV:dev}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  application:
    name: anyujia-chat
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  profiles:
    active: ${RUN_ENV:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:frameworkjava_dev}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:anyujiadev}
    password: ${MYSQL_PASSWORD:change-me}
  cloud:
    nacos:
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:change-me}
        namespace: frameworkjava-${RUN_ENV:dev}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
        fail-fast: false
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:change-me}
        namespace: frameworkjava-${RUN_ENV:dev}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
        file-extension: yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threadpool

chat:
  message-sharding:
    enabled: ${CHAT_MESSAGE_SHARDING_ENABLED:false}
    dual-write: ${CHAT_MESSAGE_SHARDING_DUAL_WRITE:false}
    read-fallback: ${CHAT_MESSAGE_SHARDING_READ_FALLBACK:true}
    physical-shard-count: ${CHAT_MESSAGE_PHYSICAL_SHARD_COUNT:32}
    backfill:
      enabled: ${CHAT_MESSAGE_SHARDING_BACKFILL_ENABLED:false}
      batch-size: ${CHAT_MESSAGE_SHARDING_BACKFILL_BATCH_SIZE:1000}
      fixed-delay-millis: ${CHAT_MESSAGE_SHARDING_BACKFILL_FIXED_DELAY_MILLIS:10000}
    verification:
      enabled: ${CHAT_MESSAGE_SHARDING_VERIFICATION_ENABLED:false}
      sample-size: ${CHAT_MESSAGE_SHARDING_VERIFICATION_SAMPLE_SIZE:1000}
      fixed-delay-millis: ${CHAT_MESSAGE_SHARDING_VERIFICATION_FIXED_DELAY_MILLIS:60000}
  rabbit:
    publisher-confirm-timeout-millis: ${CHAT_RABBIT_PUBLISHER_CONFIRM_TIMEOUT_MILLIS:3000}
  websocket:
    idle-timeout-seconds: ${CHAT_WEBSOCKET_IDLE_TIMEOUT_SECONDS:150}
    idle-scan-millis: ${CHAT_WEBSOCKET_IDLE_SCAN_MILLIS:30000}
    outbound:
      max-queued-messages: ${CHAT_WEBSOCKET_MAX_QUEUED_MESSAGES:256}
      max-queued-bytes: ${CHAT_WEBSOCKET_MAX_QUEUED_BYTES:2097152}
  content-filter:
    enabled: ${CHAT_CONTENT_FILTER_ENABLED:true}
    mode: ${CHAT_CONTENT_FILTER_MODE:REPLACE}
    replacement: ${CHAT_CONTENT_FILTER_REPLACEMENT:***}
    sensitive-words: ${CHAT_CONTENT_FILTER_WORDS:}
  rate-limit:
    conversation:
      enabled: ${CHAT_CONVERSATION_RATE_LIMIT_ENABLED:true}
      max-messages-per-second: ${CHAT_CONVERSATION_MAX_MESSAGES_PER_SECOND:50}
      idle-expire-seconds: ${CHAT_CONVERSATION_RATE_LIMIT_IDLE_EXPIRE_SECONDS:300}
  netty:
    enabled: ${CHAT_NETTY_ENABLED:false}
    bind-host: ${CHAT_NETTY_BIND_HOST:127.0.0.1}
    port: ${CHAT_NETTY_PORT:18084}
    worker-threads: ${CHAT_NETTY_WORKER_THREADS:0}
    business-threads: ${CHAT_NETTY_BUSINESS_THREADS:16}
    business-queue-capacity: ${CHAT_NETTY_BUSINESS_QUEUE_CAPACITY:1024}
    max-frame-bytes: ${CHAT_NETTY_MAX_FRAME_BYTES:65536}
    inbound:
      max-queued-messages: ${CHAT_NETTY_MAX_INBOUND_MESSAGES:64}
    outbound:
      max-queued-messages: ${CHAT_NETTY_MAX_QUEUED_MESSAGES:256}
      max-queued-bytes: ${CHAT_NETTY_MAX_QUEUED_BYTES:2097152}
    timer-tick-millis: ${CHAT_NETTY_TIMER_TICK_MILLIS:1000}
    write-buffer-low-water-mark: ${CHAT_NETTY_WRITE_LOW_WATER_MARK:32768}
    write-buffer-high-water-mark: ${CHAT_NETTY_WRITE_HIGH_WATER_MARK:65536}
