server:
  port: ${FILE_SERVER_PORT:18086}

spring:
  config:
    import:
      - optional:nacos:anyujia-file-${RUN_ENV:dev}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  application:
    name: anyujia-file
  profiles:
    active: ${RUN_ENV:dev}
  cloud:
    nacos:
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:change-me}
        namespace: frameworkjava-${RUN_ENV:dev}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
        fail-fast: false
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:change-me}
        namespace: frameworkjava-${RUN_ENV:dev}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
        file-extension: yaml
        extension-configs:
          - data-id: ${spring.application.name}-${spring.profiles.active}.yaml
            group: ${spring.cloud.nacos.config.group}
            refresh: true

logging:
  pattern:
    console: "[%thread] %-5level %logger{36} - %msg%n"
